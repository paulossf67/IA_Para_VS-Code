name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run unit tests
        run: npm run test:unit

      - name: Lint (optional)
        run: npx eslint src --ext .ts || true

      - name: Package VSIX
        run: mkdir -p artifacts && npx vsce package --allow-missing-repository --out artifacts/local-ai-vscode.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-vscode-vsix
          path: artifacts/local-ai-vscode.vsix
          retention-days: 7

  publish-marketplace:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: local-ai-vscode-vsix
          path: artifacts

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath artifacts/local-ai-vscode.vsix --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-open-vsx:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: local-ai-vscode-vsix
          path: artifacts

      - name: Publish to Open VSX Registry
        run: npx --yes ovsx publish artifacts/local-ai-vscode.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}